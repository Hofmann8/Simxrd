<!DOCTYPE html>
<html>
<head>
  <title>JSmol最小测试</title>
  <script type="text/javascript" src="./jsmol/JSmol.min.js"></script>
  <style>
    #jsmolDiv {
      width: 600px;
      height: 400px;
      margin: 0 auto;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h1>JSmol最小测试</h1>
  <div id="jsmolDiv"></div>
  <div id="status">加载中...</div>
  
  <script type="text/javascript">
    // 简单的JSmol初始化
    var jsmolApplet;
    var Info = {
      width: 600,
      height: 400,
      use: "HTML5",
      j2sPath: "./jsmol/j2s",
      script: "load $caffeine; spin on",
      disableJ2SLoadMonitor: false,
      disableInitialConsole: false,
      debug: true
    };
    
    // 等待页面加载完成
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('status').textContent = '正在初始化JSmol...';
      
      // 创建JSmol实例
      jsmolApplet = Jmol.getApplet("jsmolApplet", Info);
      document.getElementById('jsmolDiv').innerHTML = Jmol.getAppletHtml(jsmolApplet);
      
      document.getElementById('status').textContent = 'JSmol已初始化，正在加载分子...';
    });
  </script>
</body>
</html>
